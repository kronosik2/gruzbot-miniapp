<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЧестноГруз</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:#16161A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#F4F4F7;min-height:100vh;}
::placeholder{color:#5A5A64;}
input,textarea,button,select{font-family:inherit;outline:none;}

.screen{display:none;padding:16px 16px 90px;}
.screen.active{display:block;}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:#1E1E24;border-top:1px solid #2A2A32;display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:100;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;border:0;background:transparent;color:#5A5A64;cursor:pointer;font-size:9px;font-weight:700;letter-spacing:.04em;transition:.15s;}
.nb.active{color:#FFC107;}
.nb svg{width:22px;height:22px;}

/* CARDS & INPUTS */
.card{background:#1E1E24;border-radius:16px;border:1px solid #2A2A32;padding:14px;margin-bottom:12px;}
.lbl{display:block;font-size:10px;font-weight:700;color:#6A6A72;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.inp{width:100%;background:#121216;border:1px solid #2A2A32;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;color:#F4F4F7;transition:.15s;}
.inp:focus{border-color:#FFC107;box-shadow:0 0 0 3px rgba(255,193,7,.1);}
.inp.err{border-color:#EF4444;}
.em{display:none;font-size:10px;color:#EF4444;margin-top:4px;}
.em.show{display:block;}
.field{margin-bottom:12px;}

/* BUTTONS */
.btn-gold{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(135deg,#FFC831,#FFB000);color:#16161A;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;box-shadow:0 6px 20px rgba(255,184,0,.25);}
.btn-gold:active{transform:scale(.98);opacity:.9;}

/* STEPPER */
.stepper{display:flex;align-items:center;background:#121216;border:1px solid #2A2A32;border-radius:12px;overflow:hidden;}
.sbtn{width:48px;height:50px;border:0;background:transparent;color:#F4F4F7;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.sbtn:active{background:#2A2A32;}
.sval{flex:1;text-align:center;font-size:22px;font-weight:800;}

/* PAY TABS */
.ptabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#121216;border-radius:12px;padding:4px;border:1px solid #2A2A32;}
.ptab{border:0;border-radius:9px;padding:11px;font-size:12px;font-weight:700;cursor:pointer;color:#5A5A64;background:transparent;transition:.15s;}
.ptab.active{background:#1E1E24;color:#F4F4F7;box-shadow:0 1px 6px rgba(0,0,0,.3);}

/* ORDER CARDS */
.ocard{background:#1E1E24;border:1px solid #2A2A32;border-radius:14px;padding:13px;margin-bottom:10px;position:relative;overflow:hidden;}
.ocard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#FFC107;}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;}
.b-open{background:#1A2E1A;color:#4ADE80;border:1px solid #1F4A1F;}
.b-prog{background:#1A1E2E;color:#60A5FA;border:1px solid #1F2A4A;}
.b-done{background:#2A2200;color:#FFC107;border:1px solid #3A2E00;}

/* WALLET */
.wallet{background:linear-gradient(135deg,#2A2200,#1A1600);border:1px solid #3A2E00;border-radius:16px;padding:18px;margin-bottom:12px;}
.sbox{background:#121216;border-radius:12px;padding:12px;border:1px solid #2A2A32;text-align:center;}

/* AVATAR */
.avatar{width:60px;height:60px;border-radius:18px;background:#2A2200;border:2px solid #3A2E00;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#FFC107;flex:0 0 auto;}

/* TOAST */
.toast{position:fixed;left:12px;right:12px;bottom:80px;background:#1E1E24;border:1px solid #2A2A32;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;transform:translateY(200%);transition:.28s cubic-bezier(.2,.8,.2,1);z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.toast.show{transform:translateY(0);}

h2{font-size:20px;font-weight:800;letter-spacing:-.025em;margin-bottom:14px;}

input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.4);}
</style>
</head>
<body>

<!-- ═══ ЗАКАЗ ═══ -->
<div id="s-order" class="screen active">
  <h2>Новый заказ</h2>

  <div class="field">
    <label class="lbl">Адрес объекта</label>
    <input id="f-addr" class="inp" placeholder="ул. Ленина, д. 1">
    <div class="em" id="e-addr">Укажите адрес</div>
  </div>

  <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div>
      <label class="lbl">Дата</label>
      <input id="f-date" class="inp" type="date">
      <div class="em" id="e-date">Укажите дату</div>
    </div>
    <div>
      <label class="lbl">Время</label>
      <input id="f-time" class="inp" type="time">
      <div class="em" id="e-time">Укажите время</div>
    </div>
  </div>

  <div class="field">
    <label class="lbl">Грузчики</label>
    <div class="stepper">
      <button class="sbtn" onclick="cw(-1)">−</button>
      <span class="sval" id="wv">1</span>
      <span style="font-size:12px;color:#6A6A72;padding-right:4px;">чел.</span>
      <button class="sbtn" onclick="cw(1)">+</button>
    </div>
  </div>

  <div class="field">
    <label class="lbl">Ваша цена за работу</label>
    <div style="position:relative;">
      <input id="f-price" class="inp" type="number" inputmode="numeric" placeholder="3000" style="padding-right:38px;">
      <span style="position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:800;color:#FFC107;pointer-events:none;">₽</span>
    </div>
    <div class="em" id="e-price">Минимум 100 ₽</div>
  </div>

  <div class="field">
    <label class="lbl">Описание работы</label>
    <textarea id="f-desc" class="inp" rows="3" placeholder="Что нужно сделать, объём, этаж…" style="resize:none;line-height:1.5;"></textarea>
    <div class="em" id="e-desc">Опишите работу</div>
  </div>

  <div class="field">
    <label class="lbl">Тип найма</label>
    <div class="ptabs">
      <button class="ptab active" id="pt-once" onclick="setType(0)">📦 Разовый</button>
      <button class="ptab" id="pt-perm" onclick="setType(1)">🔁 Постоянный</button>
    </div>
  </div>

  <div class="field">
    <label class="lbl">Оплата</label>
    <div class="ptabs">
      <button class="ptab active" id="pp-cash" onclick="setPay('cash')">✓ Наличными</button>
      <button class="ptab" id="pp-link" onclick="setPay('link')">По ссылке</button>
    </div>
  </div>

  <button class="btn-gold" id="submit-btn" onclick="submitOrder()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M13.5 2 5 13.2h5.2L9.3 22 19 10.2h-5.4z"/></svg>
    Опубликовать заказ
  </button>
</div>

<!-- ═══ МОИ ЗАКАЗЫ ═══ -->
<div id="s-status" class="screen">
  <h2>Мои заказы</h2>
  <div id="mol"></div>
</div>

<!-- ═══ ПРОФИЛЬ ═══ -->
<div id="s-profile" class="screen">
  <div style="display:flex;align-items:center;gap:13px;margin-bottom:16px;">
    <div class="avatar" id="av">?</div>
    <div>
      <div style="font-size:18px;font-weight:800;" id="pname">—</div>
      <div style="font-size:12px;color:#6A6A72;" id="pphone">—</div>
    </div>
  </div>

  <div class="wallet">
    <div style="font-size:10px;font-weight:700;color:#B58A14;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">Кошелёк</div>
    <div style="font-size:32px;font-weight:800;color:#FFC107;" id="pbal">0 ₽</div>
    <div style="font-size:11px;color:#7A6A32;margin-top:3px;">Для оплаты публикаций и смен</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
    <div class="sbox">
      <div style="font-size:11px;color:#6A6A72;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;">Как заказчик</div>
      <div style="font-size:20px;font-weight:800;" id="prc">0</div>
      <div style="font-size:11px;color:#FFC107;margin-top:2px;" id="prc-r">⭐ 5.0</div>
    </div>
    <div class="sbox">
      <div style="font-size:11px;color:#6A6A72;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;">Как исполнитель</div>
      <div style="font-size:20px;font-weight:800;" id="prw">0</div>
      <div style="font-size:11px;color:#FFC107;margin-top:2px;" id="prw-r">⭐ 5.0</div>
    </div>
  </div>

  <div id="txlist" class="card" style="font-size:12px;color:#5A5A64;">История пуста</div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nb active" id="nb-order" onclick="gt('order')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13.5 2 5 13.2h5.2L9.3 22 19 10.2h-5.4z"/></svg>
    ЗАКАЗ
  </button>
  <button class="nb" id="nb-status" onclick="gt('status')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    МОИ
  </button>
  <button class="nb" id="nb-profile" onclick="gt('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6.4 8-6.4s8 2.4 8 6.4"/></svg>
    ПРОФИЛЬ
  </button>
</nav>

<!-- TOAST -->
<div class="toast" id="toast">
  <div style="width:28px;height:28px;border-radius:9px;background:#1FBF61;display:grid;place-items:center;flex:0 0 auto;">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div>
    <strong style="display:block;font-size:12px;" id="tt">—</strong>
    <span style="font-size:10px;color:#9A9AA6;" id="tm">—</span>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────
let workers = 1;
let isPerm  = 0;
let payMode = 'cash';
let profile = { name:'', phone:'', balance:0, oc:0, ow:0, rc:5.0, rw:5.0 };
let myOrders = [];

// ── INIT ───────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    const u = tg.initDataUnsafe?.user;
    if (u) {
      profile.name  = (u.first_name || '') + (u.last_name ? ' ' + u.last_name : '');
      profile.phone = u.username ? '@' + u.username : '';
    }
  }

  // defaults
  const now  = new Date();
  const tom  = new Date(now.getTime() + 86400000);
  const pad  = v => String(v).padStart(2,'0');
  document.getElementById('f-date').value = `${tom.getFullYear()}-${pad(tom.getMonth()+1)}-${pad(tom.getDate())}`;
  document.getElementById('f-date').min   = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  document.getElementById('f-time').value = '09:00';

  renderProfile();
  renderMOL();
});

// ── NAV ────────────────────────────────────────────
function gt(t) {
  ['order','status','profile'].forEach(x => {
    document.getElementById('s-'+x).classList.toggle('active', x===t);
    document.getElementById('nb-'+x).classList.toggle('active', x===t);
  });
}

// ── FORM CONTROLS ──────────────────────────────────
function cw(d) {
  workers = Math.max(1, Math.min(20, workers+d));
  document.getElementById('wv').textContent = workers;
}

function setType(v) {
  isPerm = v;
  document.getElementById('pt-once').className = 'ptab' + (v===0?' active':'');
  document.getElementById('pt-perm').className = 'ptab' + (v===1?' active':'');
}

function setPay(m) {
  payMode = m;
  document.getElementById('pp-cash').className = 'ptab' + (m==='cash'?' active':'');
  document.getElementById('pp-link').className = 'ptab' + (m==='link'?' active':'');
  document.getElementById('pp-cash').textContent = m==='cash' ? '✓ Наличными' : 'Наличными';
  document.getElementById('pp-link').textContent = m==='link' ? '✓ По ссылке' : 'По ссылке';
}

// ── VALIDATE ───────────────────────────────────────
function validate() {
  let ok = true;
  const rules = [
    ['f-addr',  'e-addr',  v => v.trim().length >= 5],
    ['f-date',  'e-date',  v => !!v],
    ['f-time',  'e-time',  v => !!v],
    ['f-price', 'e-price', v => Number(v) >= 100],
    ['f-desc',  'e-desc',  v => v.trim().length >= 10],
  ];
  rules.forEach(([id, eid, fn]) => {
    const el  = document.getElementById(id);
    const val = fn(el.value);
    el.classList.toggle('err', !val);
    document.getElementById(eid).classList.toggle('show', !val);
    if (!val) ok = false;
  });
  return ok;
}

// ── SUBMIT ─────────────────────────────────────────
function submitOrder() {
  if (!validate()) {
    toast('Заполни все поля', 'Проверь выделенные красным');
    return;
  }

  const addr  = document.getElementById('f-addr').value.trim();
  const date  = document.getElementById('f-date').value;
  const time  = document.getElementById('f-time').value;
  const price = Number(document.getElementById('f-price').value);
  const desc  = document.getElementById('f-desc').value.trim();
  const [y,m,d] = date.split('-');
  const dtStr = `${d}.${m} в ${time}`;

  const order = {
    action:       'create_order',
    title:        desc.slice(0, 50),
    description:  desc,
    address:      addr,
    date:         dtStr,
    payment:      price,
    workers:      workers,
    is_permanent: isPerm,
    pay_mode:     payMode,
  };

  const tg = window.Telegram?.WebApp;
  if (tg && tg.initData) {
    // Отправляем боту и закрываем
    tg.sendData(JSON.stringify(order));
  } else {
    // Демо-режим в браузере
    const id = Math.floor(100000 + Math.random()*900000);
    myOrders.unshift({ id, title: order.title, addr, dt: dtStr, pay: fmt(price), status:'open' });
    toast('Заказ создан (демо)!', 'В Telegram данные уйдут боту');
    renderMOL();
    gt('status');
  }
}

// ── MY ORDERS ──────────────────────────────────────
function renderMOL() {
  const el = document.getElementById('mol');
  if (!myOrders.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px 0;color:#5A5A64;font-size:13px;">Нет заказов — создайте во вкладке «Заказ»</div>';
    return;
  }
  const sc = { open:'<span class="badge b-open">Открыт</span>', in_progress:'<span class="badge b-prog">В работе</span>', done:'<span class="badge b-done">Выполнен</span>' };
  el.innerHTML = myOrders.map(o => `
    <div class="ocard">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <div>
          <div style="font-size:10px;color:#5A5A64;margin-bottom:2px;">#${o.id}</div>
          <div style="font-size:14px;font-weight:700;">${o.title}</div>
        </div>
        ${sc[o.status]||sc.open}
      </div>
      <div style="font-size:11px;color:#6A6A72;display:flex;flex-wrap:wrap;gap:8px;">
        <span>📍 ${o.addr}</span>
        <span>📅 ${o.dt}</span>
        <span style="color:#FFC107;font-weight:700;">💵 ${o.pay}</span>
      </div>
    </div>
  `).join('');
}

// ── PROFILE ────────────────────────────────────────
function renderProfile() {
  document.getElementById('pname').textContent  = profile.name  || 'Пользователь';
  document.getElementById('pphone').textContent = profile.phone || 'Телефон из бота';
  document.getElementById('av').textContent     = (profile.name||'П')[0].toUpperCase();
  document.getElementById('pbal').textContent   = fmt(profile.balance) + ' ₽';
  document.getElementById('prc').textContent    = profile.oc;
  document.getElementById('prw').textContent    = profile.ow;
  document.getElementById('prc-r').textContent  = '⭐ ' + profile.rc.toFixed(1);
  document.getElementById('prw-r').textContent  = '⭐ ' + profile.rw.toFixed(1);
}

// ── UTILS ──────────────────────────────────────────
function fmt(n) { return new Intl.NumberFormat('ru-RU').format(n); }

let _tt;
function toast(t, m) {
  document.getElementById('tt').textContent = t;
  document.getElementById('tm').textContent = m;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
